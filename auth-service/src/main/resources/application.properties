spring.application.name=auth-service

server.port=${AUTH_SERVICE_PORT:8082}

# JWT
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction1234567890}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Downstream services
user-service.base-url=${USER_SERVICE_URI:http://localhost:8081}

# Validation / error responses: include message body
server.error.include-message=always

logging.level.com.asheef.auth_service=INFO