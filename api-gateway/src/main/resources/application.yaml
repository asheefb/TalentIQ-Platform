server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: \"${CORS_ALLOWED_ORIGINS:*}\"
            allowedMethods: \"*\"
            allowedHeaders: \"*\"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/users/**
          filters:
             - JwtAuthGateway

        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/auth/**

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction1234567890}
  # Endpoints that should NEVER require JWT even if the route has the filter (belt-and-braces).
  public-paths: >
    /auth/**,
    /actuator/**

logging:
  level:
    com.asheef: INFO
    org.springframework.cloud.gateway: INFO