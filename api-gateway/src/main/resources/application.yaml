server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/users/**
          filter:
            - JwtAuthGateway

        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/auth/**

        - id: resume-analyzer-service
          uri: ${RESUME_ANALYZER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/ai/**
          filter:
            - JwtAuthGateway

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction1234567890}

  public-paths: >
    /auth/**,
    /actuator/**

logging:
  level:
    com.asheef: INFO
    org.springframework.cloud.gateway: INFO